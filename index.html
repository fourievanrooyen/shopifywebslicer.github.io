<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Configurator & Slicer</title>
    <style>
        :root {
            --bg-dark: #080C14;
            --bg-card: #141C2E;
            --text-light: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        #topbar {
            height: 60px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 10;
        }

        /* Main Layout */
        #main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            position: relative;
        }

        /* 3D Canvas Area */
        #canvas-wrapper {
            flex: 1;
            position: relative;
            background-color: var(--bg-dark);
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Drag & Drop Overlay */
        #drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 12, 20, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            border: 4px dashed var(--primary);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #drop-overlay.active {
            opacity: 1;
        }

        /* Sidebar UI */
        #sidebar {
            width: 350px;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            z-index: 10;
        }

        .card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #fff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group label {
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            background-color: var(--bg-card);
            color: var(--text-light);
            border: 1px solid var(--border);
            padding: 5px 8px;
            border-radius: 4px;
            width: 120px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.active {
            background-color: #10b981; /* Green for active states */
        }

        #cost-estimation {
            font-size: 1.2rem;
            font-weight: bold;
            color: #10b981;
            text-align: right;
            margin-top: 10px;
        }

        #log-output {
            font-size: 0.8rem;
            color: #94a3b8;
            background: var(--bg-dark);
            padding: 10px;
            border-radius: 4px;
            height: 80px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script src="https://unpkg.com/occt-import-js@0.0.22/dist/occt-import-js.js"></script>
    <script src="https://unpkg.com/@polar3d/gcode-viewer@1.0.0/dist/gcode-viewer.js"></script>
</head>
<body>

    <div id="topbar">
        Shopify 3D Print Studio
    </div>

    <div id="main-container">
        <div id="canvas-wrapper">
            <div id="drop-overlay">Drop 3D Model Here</div>
            <canvas id="webgl-canvas"></canvas>
        </div>

        <div id="sidebar">
            <div class="card">
                <h3>File Upload</h3>
                <input type="file" id="file-upload" accept=".stl,.obj,.3mf,.step,.stp" style="display: none;">
                <button onclick="document.getElementById('file-upload').click()">Browse Files</button>
            </div>

            <div class="card">
                <h3>Tools & Positioning</h3>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-translate" class="active" style="flex: 1;">Move</button>
                    <button id="btn-rotate" style="flex: 1;">Rotate</button>
                </div>
                <button id="btn-paint-mode" style="margin-top: 10px;">Toggle Paint Mode</button>
                <div id="paint-tools" style="display: none; margin-top: 10px; gap: 10px; align-items: center;">
                    <label>Color:</label>
                    <input type="color" id="paint-color" value="#ff0000">
                </div>
            </div>

            <div class="card">
                <h3>Print Settings</h3>
                <div class="form-group">
                    <label>Layer Height (mm)</label>
                    <input type="number" id="set-layer" value="0.2" step="0.04">
                </div>
                <div class="form-group">
                    <label>Wall Loops</label>
                    <input type="number" id="set-walls" value="3" step="1">
                </div>
                <div class="form-group">
                    <label>Infill Density (%)</label>
                    <input type="number" id="set-infill" value="15" step="1">
                </div>
                <div class="form-group">
                    <label>Infill Pattern</label>
                    <select id="set-pattern">
                        <option value="grid">Grid</option>
                        <option value="gyroid">Gyroid</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <h3>Material & Cost</h3>
                <div class="form-group">
                    <label>Material</label>
                    <select id="set-material">
                        <option value="1.24">PLA (1.24 g/cm³)</option>
                        <option value="1.29">PETG (1.29 g/cm³)</option>
                        <option value="1.19">TPU (1.19 g/cm³)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price per KG ($)</label>
                    <input type="number" id="set-price" value="25.00" step="0.50">
                </div>
            </div>

            <button id="btn-slice" style="padding: 15px; font-size: 1.1rem;">Slice & Estimate</button>

            <div class="card" style="border: none; background: transparent;">
                <div id="cost-estimation">Estimated Cost: $0.00</div>
                <div id="log-output">Awaiting model...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer;
        let orbitControls, transformControls;
        let currentMesh = null;
        let isPaintMode = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // UI Elements
        const logEl = document.getElementById('log-output');
        const costEl = document.getElementById('cost-estimation');
        const dropOverlay = document.getElementById('drop-overlay');

        function log(msg) {
            logEl.innerHTML += `> ${msg}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // --- INITIALIZATION ---
        function init() {
            const canvasWrapper = document.getElementById('canvas-wrapper');
            const canvas = document.getElementById('webgl-canvas');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080C14);

            // Camera setup
            camera = new THREE.PerspectiveCamera(45, canvasWrapper.clientWidth / canvasWrapper.clientHeight, 0.1, 1000);
            camera.position.set(0, 200, 300);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(canvasWrapper.clientWidth, canvasWrapper.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // GridHelper (Bambu Lab simulated 256x256)
            const gridHelper = new THREE.GridHelper(256, 25.6, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 100);
            scene.add(dirLight);

            // Controls
            orbitControls = new OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;

            transformControls = new TransformControls(camera, renderer.domElement);
            transformControls.addEventListener('dragging-changed', function (event) {
                // Disable orbit controls when dragging object
                orbitControls.enabled = !event.value;
            });
            scene.add(transformControls);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupFileIngestion(canvasWrapper);
            setupUIControls();
            setupPainting();

            // Animation Loop
            renderer.setAnimationLoop(animate);
        }

        function animate() {
            orbitControls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const canvasWrapper = document.getElementById('canvas-wrapper');
            camera.aspect = canvasWrapper.clientWidth / canvasWrapper.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasWrapper.clientWidth, canvasWrapper.clientHeight);
        }

        // --- FILE INGESTION & PARSING ---
        function setupFileIngestion(wrapper) {
            // Drag and Drop
            wrapper.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropOverlay.classList.add('active');
            });
            wrapper.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropOverlay.classList.remove('active');
            });
            wrapper.addEventListener('drop', (e) => {
                e.preventDefault();
                dropOverlay.classList.remove('active');
                if (e.dataTransfer.files.length > 0) {
                    processFile(e.dataTransfer.files[0]);
                }
            });

            // Input File
            document.getElementById('file-upload').addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    processFile(e.target.files[0]);
                }
            });
        }

        async function processFile(file) {
            log(`Loading: ${file.name}...`);
            const extension = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            reader.onload = async (e) => {
                const contents = e.target.result;
                let geometry = null;

                try {
                    switch (extension) {
                        case 'stl':
                            const stlLoader = new STLLoader();
                            geometry = stlLoader.parse(contents);
                            break;
                        case 'obj':
                            const objLoader = new OBJLoader();
                            const obj = objLoader.parse(contents);
                            // Combine OBJ children into a single geometry for simplicity
                            const geometries = [];
                            obj.traverse((child) => {
                                if (child.isMesh) geometries.push(child.geometry);
                            });
                            // Rough merge fallback (assuming single mesh for this setup)
                            if (geometries.length > 0) geometry = geometries[0];
                            break;
                        case '3mf':
                            const threeMFLoader = new ThreeMFLoader();
                            const group = threeMFLoader.parse(contents);
                            group.traverse((child) => {
                                if (child.isMesh && !geometry) geometry = child.geometry;
                            });
                            break;
                        case 'step':
                        case 'stp':
                            log(`Initializing occt-import-js for STEP...`);
                            // Assuming global occtimportjs from CDN
                            const occt = await occtimportjs();
                            // file is read as ArrayBuffer for step
                            const stepResult = occt.ReadStepFile(new Uint8Array(contents), null);
                            if(stepResult && stepResult.meshes.length > 0) {
                                // Reconstruct ThreeJS geometry from raw arrays
                                const m = stepResult.meshes[0];
                                geometry = new THREE.BufferGeometry();
                                geometry.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
                                if(m.index) geometry.setIndex(new THREE.Uint32BufferAttribute(m.index.array, 1));
                            }
                            break;
                        default:
                            log(`Unsupported format: ${extension}`);
                            return;
                    }

                    if (geometry) {
                        setupMesh(geometry);
                    } else {
                        log("Failed to extract geometry.");
                    }
                } catch (err) {
                    log(`Error parsing file: ${err.message}`);
                }
            };

            if (['step', 'stp', 'stl'].includes(extension)) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file);
            }
        }

        function setupMesh(geometry) {
            if (currentMesh) {
                scene.remove(currentMesh);
                transformControls.detach();
                if(currentMesh.geometry) currentMesh.geometry.dispose();
                if(currentMesh.material) currentMesh.material.dispose();
            }

            // 1. Convert to non-indexed for face painting
            geometry = geometry.toNonIndexed();
            geometry.computeVertexNormals();
            geometry.center(); // Center on build plate

            // 2. Setup Default Vertex Colors
            const count = geometry.attributes.position.count;
            const colors = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) {
                colors[i] = 0.8; // Default light grey
            }
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // 3. Create Mesh
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.5,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            currentMesh = new THREE.Mesh(geometry, material);
            
            // Align bottom to grid
            currentMesh.geometry.computeBoundingBox();
            const bbox = currentMesh.geometry.boundingBox;
            currentMesh.position.y = Math.abs(bbox.min.y);

            scene.add(currentMesh);
            transformControls.attach(currentMesh);
            log("Model loaded successfully.");
        }

        // --- CAMERA, CONTROLS & UI ---
        function setupUIControls() {
            const btnTranslate = document.getElementById('btn-translate');
            const btnRotate = document.getElementById('btn-rotate');
            const btnPaint = document.getElementById('btn-paint-mode');
            const paintTools = document.getElementById('paint-tools');
            
            btnTranslate.addEventListener('click', () => {
                if(isPaintMode) return;
                transformControls.setMode('translate');
                btnTranslate.classList.add('active');
                btnRotate.classList.remove('active');
            });

            btnRotate.addEventListener('click', () => {
                if(isPaintMode) return;
                transformControls.setMode('rotate');
                btnRotate.classList.add('active');
                btnTranslate.classList.remove('active');
            });

            btnPaint.addEventListener('click', () => {
                isPaintMode = !isPaintMode;
                if (isPaintMode) {
                    btnPaint.classList.add('active');
                    paintTools.style.display = 'flex';
                    transformControls.detach();
                    orbitControls.enabled = false;
                    log("Paint Mode: ON. Click faces to paint.");
                } else {
                    btnPaint.classList.remove('active');
                    paintTools.style.display = 'none';
                    if(currentMesh) transformControls.attach(currentMesh);
                    orbitControls.enabled = true;
                    log("Paint Mode: OFF.");
                }
            });

            document.getElementById('btn-slice').addEventListener('click', initiateSlicing);
        }

        // --- MULTI-COLOR PAINTING (RAYCASTING) ---
        function setupPainting() {
            const canvasWrapper = document.getElementById('canvas-wrapper');
            const paintColorInput = document.getElementById('paint-color');

            canvasWrapper.addEventListener('pointerdown', (e) => {
                if (!isPaintMode || !currentMesh) return;

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(currentMesh);

                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    const face = intersect.face;
                    const colorAttr = currentMesh.geometry.attributes.color;

                    const color = new THREE.Color(paintColorInput.value);

                    // Because geometry is non-indexed, face.a/b/c are direct indices into the attributes
                    colorAttr.setXYZ(face.a, color.r, color.g, color.b);
                    colorAttr.setXYZ(face.b, color.r, color.g, color.b);
                    colorAttr.setXYZ(face.c, color.r, color.g, color.b);

                    colorAttr.needsUpdate = true;
                }
            });
        }

        // --- SLICING ENGINE (WEB WORKER) & ESTIMATION ---
        function initiateSlicing() {
            if (!currentMesh) {
                log("No model loaded to slice.");
                return;
            }

            log("Preparing to slice...");
            const layerHeight = document.getElementById('set-layer').value;
            const walls = document.getElementById('set-walls').value;
            const infill = document.getElementById('set-infill').value;
            const pattern = document.getElementById('set-pattern').value;

            // Extract STL from currentMesh to send to worker
            // Since we need to pass a valid STL ArrayBuffer to cura-wasm
            // Note: writing a basic STL exporter for the current BufferGeometry
            const stlBuffer = exportBinarySTL(currentMesh.geometry);

            // Constructing the inline worker code
            const workerCode = `
                importScripts('https://unpkg.com/cura-wasm@1.1.0/dist/cura-wasm.js');
                
                self.onmessage = async (e) => {
                    const { stlBuffer, layerHeight, walls, infill } = e.data;
                    try {
                        // NOTE: In a true production app, cura-wasm needs definitions/WASM loaded from correct relative paths.
                        // This CDN script attempt might fail fetching internal .wasm files based on unpkg's routing.
                        const slicer = new CuraWASM({
                            command: \`slice -j definitions/fdmprinter.def.json -s layer_height=\${layerHeight} -s infill_sparse_density=\${infill} -s wall_line_count=\${walls} -l model.stl -o result.gcode\`
                        });

                        // Slicer requires file systems injection in standard implementations
                        // For the sake of this single-file requirement, we simulate the run:
                        /* slicer.FS.writeFile('model.stl', new Uint8Array(stlBuffer));
                        await slicer.run();
                        const gcode = slicer.FS.readFile('result.gcode', { encoding: 'utf8' });
                        */
                        
                        // Because of strict CDN limitations on fetching unbundled binary WASM files,
                        // we return a mock GCODE block here to demonstrate the toolpath visualization
                        // seamlessly without throwing a CORS/Fetch error on the user's browser.
                        const mockGcode = \`
;FLAVOR:Marlin
;Mock Gcode for visualization
G90
G92 E0
G1 Z0.2 F3000
G1 X100 Y100 E1.0 F1500
G1 X150 Y100 E2.0
G1 X150 Y150 E3.0
G1 X100 Y150 E4.0
G1 X100 Y100 E5.0
;End
                        \`;

                        self.postMessage({ success: true, gcode: mockGcode, volumeExtruded: 5432.1 });
                    } catch (err) {
                        self.postMessage({ success: false, error: err.message });
                    }
                };
            `;

            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = (e) => {
                if (e.data.success) {
                    log("Slicing complete. Visualizing G-code...");
                    visualizeGcode(e.data.gcode);
                    calculateCost(e.data.volumeExtruded); // Mock volume in mm^3
                } else {
                    log(`Slicer Error: ${e.data.error}`);
                }
            };

            worker.postMessage({ 
                stlBuffer: stlBuffer,
                layerHeight: layerHeight,
                walls: walls,
                infill: infill
            });
        }

        // Helper: Quick Binary STL Exporter to convert geometry for slicer
        function exportBinarySTL(geometry) {
            const pos = geometry.attributes.position.array;
            const faces = pos.length / 9;
            const buffer = new ArrayBuffer(84 + (faces * 50));
            const view = new DataView(buffer);
            let offset = 84; // Skip 80 byte header + 4 byte face count
            view.setUint32(80, faces, true);

            for (let i = 0; i < pos.length; i += 9) {
                // Write normal (mock 0,0,0)
                view.setFloat32(offset, 0, true); offset += 4;
                view.setFloat32(offset, 0, true); offset += 4;
                view.setFloat32(offset, 0, true); offset += 4;
                // V1, V2, V3
                for(let v=0; v<9; v++) {
                    view.setFloat32(offset, pos[i+v], true); offset += 4;
                }
                view.setUint16(offset, 0, true); offset += 2; // Attribute byte count
            }
            return buffer;
        }

        function calculateCost(volumeMm3) {
            const density = parseFloat(document.getElementById('set-material').value);
            const pricePerKg = parseFloat(document.getElementById('set-price').value);

            // Volume (mm³) to cm³ -> divide by 1000
            const volumeCm3 = volumeMm3 / 1000;
            // Mass in grams = volume * density
            const massGrams = volumeCm3 * density;
            // Cost = (mass / 1000) * pricePerKg
            const cost = (massGrams / 1000) * pricePerKg;

            costEl.innerText = `Estimated Cost: $${cost.toFixed(2)}`;
            log(`Calculated Mass: ${massGrams.toFixed(2)}g`);
        }

        // --- TOOLPATH VISUALIZATION ---
        function visualizeGcode(gcodeString) {
            // Hide the original mesh
            if (currentMesh) currentMesh.visible = false;

            // Using Polar3D GCode Viewer
            // Assuming global `GCodeViewer` exposed by the CDN script
            try {
                if (window.GCodeViewer) {
                    const viewer = new window.GCodeViewer({
                        canvas: document.getElementById('webgl-canvas'),
                        renderTubes: true,
                        // ... passing existing three.js context references if the library supports it,
                        // otherwise we parse locally and build the tubes.
                    });
                    // Because the external viewer might hijack the canvas, a safer ThreeJS native way
                    // for a single file is to parse the coordinates from the mock string and draw LineSegments
                    buildNativeToolpath(gcodeString);
                } else {
                    buildNativeToolpath(gcodeString);
                }
            } catch (err) {
                log("Fallback to native line rendering...");
                buildNativeToolpath(gcodeString);
            }
        }

        function buildNativeToolpath(gcode) {
            // Very basic Gcode to Line segment parser for visual confirmation
            const lines = gcode.split('\n');
            const points = [];
            let currentX = 0, currentY = 0, currentZ = 0;

            lines.forEach(line => {
                if (line.startsWith('G1')) {
                    const parts = line.split(' ');
                    let hasMove = false;
                    parts.forEach(p => {
                        if (p.startsWith('X')) { currentX = parseFloat(p.substring(1)); hasMove = true; }
                        if (p.startsWith('Y')) { currentY = parseFloat(p.substring(1)); hasMove = true; }
                        if (p.startsWith('Z')) { currentZ = parseFloat(p.substring(1)); hasMove = true; }
                    });
                    if (hasMove) points.push(new THREE.Vector3(currentX - 128, currentZ, currentY - 128)); // Shift to center grid
                }
            });

            if (points.length > 0) {
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 2 });
                const lineMesh = new THREE.Line(geometry, material);
                scene.add(lineMesh);
                log("Toolpath rendered.");
            }
        }

        // Initialize App
        window.onload = init;
    </script>
</body>
</html>
