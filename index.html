<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayerWorks Interactive Web Slicer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

<style>
    :root {
        --bg: #080C14; --bg2: #0E1420; --card: #141C2E; --card2: #1A2540;
        --border: rgba(255,255,255,0.06); --cyan: #00E5FF; --cyan15: rgba(0,229,255,0.12);
        --white: #EFF4F8; --dim: #4A5568; --font: 'Outfit', sans-serif;
    }
    body, html { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--white); font-family: var(--font); }
   .app { display: flex; flex-direction: column; height: 100vh; }
    
   .topbar { display: flex; align-items: center; padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); }
   .topbar-logo { font-weight: 800; font-size: 18px; color: var(--cyan); }
   .topbar-badge { font-size: 11px; margin-left: 10px; background: var(--card2); padding: 4px 10px; border-radius: 20px; color: var(--dim); font-weight: 700; letter-spacing: 1px; text-transform: uppercase;}
   .topbar-file { margin-left: auto; font-size: 12px; color: var(--dim); }
    
   .main { display: flex; flex: 1; }
   .viewer { flex: 1; position: relative; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    
   .toolbar { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
   .tool-btn { background: var(--card); border: 1px solid var(--border); color: var(--white); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-family: var(--font); transition: 0.2s; font-size: 13px; text-align: left; }
   .tool-btn:hover { border-color: rgba(0,229,255,0.5); }
   .tool-btn.active { background: var(--cyan15); border-color: var(--cyan); color: var(--cyan); }
    
   .color-palette { display: none; flex-wrap: wrap; gap: 5px; width: 130px; padding: 10px; background: var(--card); border-radius: 8px; border: 1px solid var(--border); margin-top: 5px; }
   .color-swatch { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
   .color-swatch.active { border-color: var(--white); transform: scale(1.1); }
    
   .sidebar { width: 350px; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
   .section-title { font-size: 14px; font-weight: 700; color: var(--dim); text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; border-bottom: 1px solid var(--cyan); padding-bottom: 10px;}
    
   .setting-group { margin-bottom: 20px; }
   .setting-group label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; font-weight: 600; color: var(--dim);}
   .setting-group select,.setting-group input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--white); padding: 10px; border-radius: 6px; outline: none; font-family: var(--font); }
    
   .action-btn { background: var(--cyan); color: #000; font-weight: 700; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 10px; font-family: var(--font); transition: 0.2s; width: 100%; }
   .action-btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--cyan15); }
    
   .dropzone { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; transition: 0.2s; }
   .dropzone.hidden { display: none; }
   .drop-btn { background: var(--cyan15); border: 1px solid var(--cyan); color: var(--cyan); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 15px; transition: 0.2s;}
   .drop-btn:hover { background: var(--cyan30); }
    
   .slicing-overlay { position: absolute; inset: 0; background: rgba(8, 12, 20, 0.9); z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; }
   .loader { border: 4px solid var(--card); border-top: 4px solid var(--cyan); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

   .cost-box { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-top: 20px; display: none; }
   .cost-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: var(--white); }
   .cost-total { border-top: 1px solid var(--border); padding-top: 10px; font-size: 18px; font-weight: bold; color: var(--cyan); margin-top: 10px; }
</style>
</head>
<body>

<div class="app">
    <div class="topbar">
        <span class="topbar-logo">LayerWorks</span>
        <span class="topbar-badge">3D Configurator</span>
        <span class="topbar-file" id="topFileName"></span>
    </div>
    
    <div class="main">
        <div class="viewer" id="viewer-container">
            <canvas id="3d-canvas"></canvas>
            
            <div class="toolbar" id="toolbar" style="display: none;">
                <button class="tool-btn active" id="mode-camera">🔄 Orbit Camera</button>
                <button class="tool-btn" id="mode-move">⬌ Move Object</button>
                <button class="tool-btn" id="mode-paint">🖌️ Paint Faces</button>
                
                <div class="color-palette" id="color-palette">
                    <div class="color-swatch active" style="background: #00E5FF;" data-hex="0x00E5FF"></div>
                    <div class="color-swatch" style="background: #EF4444;" data-hex="0xEF4444"></div>
                    <div class="color-swatch" style="background: #34D399;" data-hex="0x34D399"></div>
                    <div class="color-swatch" style="background: #FBBF24;" data-hex="0xFBBF24"></div>
                    <div class="color-swatch" style="background: #FFFFFF;" data-hex="0xFFFFFF"></div>
                </div>
            </div>

            <div class="dropzone" id="dropzone">
                <div style="font-size:16px;font-weight:600;color:var(--white)">Drag & drop a 3D File</div>
                <div style="font-size:12px;color:var(--dim);margin-top:8px;">Supports.stl</div>
                <label class="drop-btn">
                    Choose File
                    <input type="file" id="file-input" accept=".stl" style="display: none;">
                </label>
            </div>
            
            <div class="slicing-overlay" id="slicing-overlay">
                <div class="loader"></div>
                <h3 style="color: var(--cyan);">Generating Toolpaths...</h3>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="section-title">Configuration</div>
            <div id="initial-sidebar-text" style="text-align: center; color: var(--dim); padding-top: 40px; font-size: 13px;">
                Upload a model to adjust advanced 3D printing settings and request a quote.
            </div>

            <div id="settings-panel" style="display: none;">
                <div class="setting-group">
                    <label>Layer Height</label>
                    <select id="setting-layer">
                        <option value="0.12">0.12mm (Fine)</option>
                        <option value="0.20" selected>0.20mm (Standard)</option>
                        <option value="0.28">0.28mm (Draft)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Wall Loops</label>
                    <input type="number" id="setting-walls" value="2" min="1" max="10">
                </div>

                <div class="setting-group">
                    <label>Top / Bottom Layers</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="setting-top" value="4" min="0" placeholder="Top">
                        <input type="number" id="setting-bottom" value="4" min="0" placeholder="Bottom">
                    </div>
                </div>

                <div class="setting-group">
                    <label>Infill Density</label>
                    <select id="setting-infill">
                        <option value="10">10%</option>
                        <option value="15" selected>15%</option>
                        <option value="25">25%</option>
                        <option value="50">50%</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label>Infill Pattern</label>
                    <select id="setting-pattern">
                        <option value="grid">Grid</option>
                        <option value="gyroid" selected>Gyroid</option>
                        <option value="honeycomb">Honeycomb</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Filament Type</label>
                    <select id="setting-material">
                        <option value="1.24|25" selected>Bambu Basic PLA</option>
                        <option value="1.27|28">Bambu PETG Basic</option>
                        <option value="1.04|30">Bambu ABS</option>
                    </select>
                </div>

                <button class="action-btn" id="btn-slice">Slice & Estimate</button>
                
                <div class="cost-box" id="cost-box">
                    <div class="cost-row"><span>Estimated Mass:</span> <span id="est-mass">0 g</span></div>
                    <div class="cost-row"><span>Print Time:</span> <span id="est-time">0h 0m</span></div>
                    <div class="cost-row cost-total"><span>Total Cost:</span> <span id="est-cost">$0.00</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let scene, camera, renderer, orbitControls, transformControls;
    let currentMesh = null;
    let currentMode = 'camera'; 
    let paintColor = new THREE.Color(0x00E5FF); 
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function init3D() {
        const container = document.getElementById('viewer-container');
        const canvas = document.getElementById('3d-canvas');

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 200, 350);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);

        const grid = new THREE.GridHelper(256, 25, 0x4A5568, 0x1A2540);
        scene.add(grid);
        const plateGeo = new THREE.PlaneGeometry(256, 256);
        const plateMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide });
        const plate = new THREE.Mesh(plateGeo, plateMat);
        plate.rotation.x = Math.PI / 2;
        plate.position.y = -0.1;
        scene.add(plate);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50);
        scene.add(dirLight);

        orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;

        transformControls = new THREE.TransformControls(camera, renderer.domElement);
        transformControls.addEventListener('dragging-changed', (event) => {
            orbitControls.enabled =!event.value;
        });
        scene.add(transformControls);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        canvas.addEventListener('mousedown', (event) => {
            if (currentMode!== 'paint' ||!currentMesh) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(currentMesh);
            
            if (intersects.length > 0) {
                const face = intersects.face;
                const colorAttr = currentMesh.geometry.getAttribute('color');
                colorAttr.setXYZ(face.a, paintColor.r, paintColor.g, paintColor.b);
                colorAttr.setXYZ(face.b, paintColor.r, paintColor.g, paintColor.b);
                colorAttr.setXYZ(face.c, paintColor.r, paintColor.g, paintColor.b);
                colorAttr.needsUpdate = true;
            }
        });

        requestAnimationFrame(animate);
    }

    function animate() {
        requestAnimationFrame(animate);
        orbitControls.update();
        renderer.render(scene, camera);
    }

    function handleFile(file) {
        document.getElementById('topFileName').textContent = file.name;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            if (currentMesh) {
                scene.remove(currentMesh);
                transformControls.detach();
                currentMesh.geometry.dispose();
            }

            const loader = new THREE.STLLoader();
            let geometry = loader.parse(e.target.result);
            
            if (geometry.index) geometry = geometry.toNonIndexed();
            
            const colors = new Float32Array(geometry.attributes.position.count * 3);
            colors.fill(0.9);
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6 });
            currentMesh = new THREE.Mesh(geometry, material);
            
            geometry.computeBoundingBox();
            const center = geometry.boundingBox.getCenter(new THREE.Vector3());
            currentMesh.position.set(-center.x, -geometry.boundingBox.min.y, -center.z);

            scene.add(currentMesh);
            
            document.getElementById('dropzone').classList.add('hidden');
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('initial-sidebar-text').style.display = 'none';
            document.getElementById('settings-panel').style.display = 'block';
            
            setMode('camera');
        };
        reader.readAsArrayBuffer(file); // Reads the single file passed to the function
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`mode-${mode}`).classList.add('active');
        
        const palette = document.getElementById('color-palette');

        if (mode === 'move') {
            transformControls.attach(currentMesh);
            orbitControls.enabled = true;
            palette.style.display = 'none';
        } else if (mode === 'paint') {
            transformControls.detach();
            orbitControls.enabled = false; 
            palette.style.display = 'flex';
        } else {
            transformControls.detach();
            orbitControls.enabled = true;
            palette.style.display = 'none';
        }
    }

    function calculateVolume(geometry) {
        let volume = 0;
        const pos = geometry.getAttribute('position');
        for (let i = 0; i < pos.count; i += 3) {
            let p1 = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
            let p2 = new THREE.Vector3(pos.getX(i+1), pos.getY(i+1), pos.getZ(i+1));
            let p3 = new THREE.Vector3(pos.getX(i+2), pos.getY(i+2), pos.getZ(i+2));
            volume += p1.dot(p2.cross(p3)) / 6.0;
        }
        return Math.abs(volume) / 1000;
    }

    document.addEventListener("DOMContentLoaded", () => {
        init3D();

        const fileInput = document.getElementById('file-input');
        const dropzone = document.getElementById('dropzone');

        // FIX 1: Pass only the first file in the array so it loads perfectly
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files);
        });

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.style.background = 'rgba(0, 229, 255, 0.1)';
        });
        
        dropzone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropzone.style.background = '#080C14'; 
        });
        
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.style.background = '#080C14';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files); // FIX 1: Target the specific file
            }
        });

        document.getElementById('mode-camera').onclick = () => setMode('camera');
        document.getElementById('mode-move').onclick = () => setMode('move');
        document.getElementById('mode-paint').onclick = () => setMode('paint');

        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.onclick = (e) => {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                e.target.classList.add('active');
                paintColor.setHex(parseInt(e.target.dataset.hex));
            };
        });

        document.getElementById('btn-slice').onclick = () => {
            if (!currentMesh) return;
            document.getElementById('slicing-overlay').style.display = 'flex';
            
            setTimeout(() => {
                document.getElementById('slicing-overlay').style.display = 'none';
                
                const infill = parseFloat(document.getElementById('setting-infill').value) / 100;
                const matData = document.getElementById('setting-material').value.split('|');
                const density = parseFloat(matData); 
                const pricePerKg = parseFloat(matData[1]); 
                
                const solidVolume = calculateVolume(currentMesh.geometry);
                const estimatedPrintVolume = solidVolume * (0.4 + infill); 
                const mass = estimatedPrintVolume * density;
                const materialCost = (mass / 1000) * pricePerKg;
                
                const layerHeight = parseFloat(document.getElementById('setting-layer').value);
                const timeMinutes = Math.floor(mass * (0.2 / layerHeight) * 3); 
                
                document.getElementById('est-mass').innerText = mass.toFixed(2) + " g";
                document.getElementById('est-time').innerText = `${Math.floor(timeMinutes/60)}h ${timeMinutes%60}m`;
                document.getElementById('est-cost').innerText = "$" + materialCost.toFixed(2);
                
                document.getElementById('cost-box').style.display = 'block';

                currentMesh.material.wireframe = true;
                setTimeout(() => { currentMesh.material.wireframe = false; }, 3000);

            }, 1500); 
        };
    });
</script>
</body>
</html>
